spring:
  application:
    name: cosmic-cats
  profiles:
    active: local
  jpa:
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: UTC
        jdbc.batch_size: 15
        order_inserts: true
        order_updates: true
        query.fail_on_pagination_over_collection_fetch: true
        query.in_clause_parameter_padding: true
        connection.provider_disables_autocommit: true
    hibernate:
      ddl-auto: none
  datasource:
    url: jdbc:postgresql://localhost:5432/cosmic_cats
    username: cosmic-cat
    password: cosmic-password
    hikari:
      auto-commit: false
      connection-timeout: 30000
      maximum-pool-size: 10
      max-lifetime: 1800000
      pool-name: galactic-market
  liquibase:
    change-log: classpath:liquibase/changelog.yaml
    enabled: true

server:
  port: 8080

# application props
application:
  base-url: /api/v1/products
  integration:
    rest-client:
      connect-timeout-millis: 500
      read-timeout-millis: 2000
      retries: 2
      timeout-on-failure-millis: 1000

  competitors-price-observer:
    url-wildcard: http://localhost:8081/competitors-price-observer/v1/product/{productId}/prices

  feature:
    toggles:
      kitty-products: true
      junior-cat-products: false
      senior-cat-products: false
---
spring:
  config:
    activate:
      on-profile: dev
application:
  feature:
    toggles:
      kitty-products: true
      junior-cat-products: true
      senior-cat-products: true